name: 'Stream build output to a check run'
description: >-
  Publish a command's output into a GitHub check run while it runs, so a reader with a token can
  follow the build live. The Actions log is not readable until the step finishes; a check run's
  output.text is.
author: easydev-org
branding:
  icon: activity
  color: blue

inputs:
  command:
    description: >-
      The command to run and stream. Passed to the shell as-is.
    required: true
  token:
    description: >-
      Token used to create and update the check run. The caller passes its workflow token.
      It cannot be implicit: a composite action does not inherit the caller's environment, and
      this file has no access to the github context at all — naming that context in an expression
      here is a template error the runner refuses to load, even inside a description.
    required: true
  name:
    description: >-
      Name of the check run. Defaults to the job name, so one step per job needs no configuration.
    required: false
    default: ''
  continue-on-failure:
    description: >-
      Report the command's exit code in the check run but do NOT fail the step. For a caller that
      makes its own judgement from what the command left behind.

      macos15's clean is the reason this exists: the process can be killed by a SIGTERM after it
      has finished its work (run 42919582582 exited 241 half a second after `the guest powered
      off`), and the workflow's own shell cannot make the verdict because the same signal kills
      that shell too. A separate step reads out/clean-macos.txt instead, and it can only run if
      this step did not fail.
    required: false
    default: 'false'
  interval:
    description: >-
      Seconds between updates. Every line would be one API call per line — far too many; a build
      that prints a thousand lines a second would be a thousand requests a second.
    required: false
    default: '5'
  max_bytes:
    description: >-
      Character cap for the published text. GitHub refuses anything above 65535, so this is capped
      there; the newest lines are kept and the oldest are dropped with a note.
    required: false
    default: '65535'

runs:
  using: 'composite'
  steps:
    - name: stream output
      shell: bash
      # THE ENVIRONMENT IS HOW A COMPOSITE ACTION PASSES INPUTS, because neither the caller's env nor
      # the `github` context reaches this file.
      #
      # `INPUT_CONTINUE-ON-FAILURE` IS COPIED TO A NAME A SHELL CAN EXPAND. The input's own name has a
      # hyphen, so the runner sets `INPUT_CONTINUE-ON-FAILURE`, which is not a valid shell variable -
      # the Python version read it through an argv flag built in bash, and this keeps the alias.
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_NAME: ${{ inputs.name }}
        INPUT_INTERVAL: ${{ inputs.interval }}
        INPUT_MAX_BYTES: ${{ inputs.max_bytes }}
        LC_CONTINUE_ON_FAILURE: ${{ inputs.continue-on-failure }}
      run: |
        set -euo pipefail
        # THE SCRIPT SITS IN THE ACTION'S OWN CHECKOUT, beside this file's parent. `$GITHUB_ACTION_PATH`
        # is where that is; a relative path would be resolved against the CALLER's working directory.
        script="$GITHUB_ACTION_PATH/../lib/log_stream.sh"
        if [ ! -f "$script" ]; then
          echo "log-stream: $script is missing from the action checkout" >&2
          exit 2
        fi
        # `exec` SO THIS SHELL IS REPLACED RATHER THAN PARENTING THE STREAMER.
        #
        # THE RUNNER SIGNALS THE STEP'S PROCESS. A non-interactive bash has no SIGTERM trap and no job
        # control forwarding: it dies, the streamer is orphaned onto PID 1, and its own kill-tree code
        # never runs - which is how a cancelled leg used to leave qemu holding /dev/kvm. With `exec`
        # the streamer IS the step's process and the first signal lands on its trap.
        exec sh "$script"
