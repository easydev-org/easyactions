name: 'OCI push'
description: >-
  Push a file to a container registry as an OCI artifact, tagged and annotated, with the tag
  written to the step output so the next job can pull it.
author: easydev-org
branding:
  icon: upload-cloud
  color: green

inputs:
  path:
    description: >-
      The file to push. A glob is allowed and must match exactly one file, for artifacts whose
      name the producer chooses - a packer that renames .tar.zst to .7z is one.
    required: true
  tag:
    description: >-
      The exact tag. Leave empty to build one from kind and the clock, which is what a
      bake wants: "which build is this" has to stay answerable, and a moving tag would
      make that untrue.
    required: false
    default: ''
  kind:
    description: >-
      What this artifact is - windows-base, macos15-desktop. Used as the tag prefix and
      as the dev.easydev.kind annotation. Optional when tag is given.
    required: false
    default: ''
  stamp:
    description: 'Append -<UTC timestamp> to a tag built from kind.'
    required: false
    default: 'true'
  registry:
    description: 'Registry host.'
    required: false
    default: 'ghcr.io'
  repository:
    description: >-
      owner/name to push into. Defaults to $GITHUB_REPOSITORY lowercased; a registry that
      is not GitHub sets neither, so it is passed explicitly there.
    required: false
    default: ''
  media-type:
    description: >-
      The artifact type recorded on the manifest. Callers that store something other than
      a disk pass their own; the default matches the qcow2 disks this organisation bakes.
    required: false
    default: 'application/vnd.easydev.disk.qcow2'
  annotations:
    description: >-
      Extra manifest annotations, one key=value per line. Values are read here rather than
      interpolated by a shell, so a value with spaces or quotes survives.
    required: false
    default: ''
  token:
    description: 'Token for the registry. Defaults to $GITHUB_TOKEN.'
    required: false
    default: ''

  distinct-from:
    description: >-
      A file this artifact must NOT be byte-identical to. Empty means no check.

      FOR STAGES THAT ARE SUPPOSED TO CHANGE A DISK. A stage that boots a disk, does work and
      publishes it is a stage whose OUTPUT IS DIFFERENT BY CONSTRUCTION; if the output is the
      same bytes as the input, the stage did not do what it claims, and every downstream job
      will silently test the wrong disk.

      That is not hypothetical. macos15's desktop stage ran to green - sixteen walkthrough
      steps, the wizard answered, the desktop reached - and published an artifact whose content
      layer digest was IDENTICAL to the setup disk it had been given:

          [oci-push] Exists    f7bd5255e8b0 macos15-desktop.qcow2
          [oci-push] Uploaded  20ce9bcf2e59 macos15-desktop

      oras saw an existing layer and reused it, which is a correct optimisation and a terrible
      silence. `macos15-desktop` and `macos15-setup` then resolved to the same bytes, and the
      ssh stage booted a disk still sitting in the Setup Assistant - which looked, from the
      inside, exactly like a wizard nobody had driven (VoiceOver overlay and all).

      Comparing digests HERE and failing is the difference between a stage that reports success
      and a stage that succeeded.
    required: false
    default: ''

  distinct-digest:
    description: >-
      A sha256 the artifact must NOT equal. The companion to `distinct-from`, for a caller whose
      baseline file no longer exists when it publishes.

      macos15's desktop stage MOVES the disk it was given (`working_copy` moves by default,
      because the published copy is still in the registry and copying 28 GiB buys nothing), so by
      the time the workflow pushes there is no input file left to hash. The stage hashes it
      before it moves anything and passes the number here.

      A digest that is the wrong length or not hex is an error: a typo must not silently disable
      the check, because this check is what turned "sixteen walkthrough steps answered" into a
      published artifact that was byte-identical to its own input.
    required: false
    default: ''

  check-name:
    description: 'Name of the check run the progress is published to'
    required: false
    default: 'oci-push'

outputs:
  tag:
    description: 'The tag that was pushed.'
    value: ${{ steps.push.outputs.tag }}
  reference:
    description: 'The full reference, registry/repo:tag.'
    value: ${{ steps.push.outputs.reference }}

runs:
  using: 'composite'
  steps:
    - name: push
      id: push
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_KIND: ${{ inputs.kind }}
        INPUT_STAMP: ${{ inputs.stamp }}
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_MEDIA_TYPE: ${{ inputs.media-type }}
        INPUT_DISTINCT_FROM: ${{ inputs.distinct-from }}
        INPUT_DISTINCT_DIGEST: ${{ inputs.distinct-digest }}
        INPUT_ANNOTATIONS: ${{ inputs.annotations }}
        GITHUB_TOKEN: ${{ inputs.token || github.token }}
      # STREAMED, BECAUSE A SILENT TRANSFER IS INDISTINGUISHABLE FROM A HANG.
      #
      # This action moves 28 GiB in the macOS stages and printed nothing until it
      # finished, so a running job had no output at all - the Actions log cannot be
      # read until the step ends, and there was nothing else to read. log_stream.py
      # publishes the same lines to a check run while they happen.
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../lib/log_stream.py" \
          --name "${{ inputs.check-name }}" --interval 20 \
          -- python3 "$GITHUB_ACTION_PATH/oci_push.py"

