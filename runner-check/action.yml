name: 'Runner check'
description: >-
  Assert the two things every VM job here needs before it starts: /dev/kvm it can actually
  open, and enough free disk after pruning what is safe to prune. Fails with a message that
  names the fix rather than a timeout twenty minutes later.
author: easydev-org
branding:
  icon: hard-drive
  color: purple

inputs:
  kvm:
    description: >-
      Require /dev/kvm. Set false for a job that only moves files - the pull and publish
      stages do not boot anything.
    required: false
    default: 'true'
  disk-gb:
    description: >-
      Free GB this job needs. 0 skips the check. Large enough for the working copy, the
      compressed result and the recording; not the disk's virtual size, which is why the
      number differs per stage.
    required: false
    default: '0'
  prune:
    description: >-
      Delete what is safe to delete when the space is short. The runner images carry the
      .NET SDK, the Android SDK, GHC and CodeQL whether or not a job uses them.
    required: false
    default: 'true'

  token:
    description: >-
      Token used to create the check run the output is published to. A composite action does
      not inherit the caller's environment and cannot read the `github` context, so this has
      to be passed. Without it the check still runs; its output just stays in the Actions log.
    required: false
    default: ''

  check-name:
    description: 'Name of the check run the output is published to.'
    required: false
    default: 'runner-check'

runs:
  using: 'composite'
  steps:
    - name: runner-check
      shell: bash
      # THE ENVIRONMENT IS HOW A COMPOSITE ACTION PASSES INPUTS: neither the caller's env nor the
      # `github` context reaches this file. A hyphenated input name (`disk-gb`) becomes
      # `INPUT_DISK-GB`, which no shell can expand, so the script reads the names defined here.
      #
      # AN INPUT WITH A HYPHEN IS WHERE THE ALIAS MATTERS, and the note above says why.
      env:
        INPUT_KVM: ${{ inputs.kvm }}
        INPUT_DISK_GB: ${{ inputs.disk-gb }}
        INPUT_PRUNE: ${{ inputs.prune }}
        INPUT_CHECK_NAME: ${{ inputs.check-name }}
      run: |
        set -euo pipefail
        # THE SCRIPT SITS IN THE ACTION'S OWN CHECKOUT, one level up from this directory.
        # `$GITHUB_ACTION_PATH` is where that is; a relative path would resolve against the CALLER's
        # working directory.
        script="$GITHUB_ACTION_PATH/../lib/runner_check.sh"
        if [ ! -f "$script" ]; then
          echo "runner-check: $script is missing from the action checkout" >&2
          exit 2
        fi
        # `exec` SO THIS SHELL IS THE SCRIPT RATHER THAN ITS PARENT: the runner signals the step's
        # process, and a non-interactive bash has no SIGTERM trap - it would die and orphan the work
        # onto PID 1, where no handler of its own can run.
        exec sh "$script"
