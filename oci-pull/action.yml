name: 'OCI pull'
description: >-
  Pull an OCI artifact from a container registry, resuming the blob across resets instead of
  starting a multi-gigabyte transfer over.
author: easydev-org
branding:
  icon: download-cloud
  color: blue

inputs:
  tag:
    description: 'The tag to pull.'
    required: true
  dest:
    description: 'Directory to write into.'
    required: false
    default: 'out'
  path:
    description: >-
      The file name to write. Defaults to the publisher's title annotation, then to
      <tag>.qcow2.
    required: false
    default: ''
  registry:
    description: 'Registry host.'
    required: false
    default: 'ghcr.io'
  repository:
    description: >-
      owner/name to pull from. Defaults to $GITHUB_REPOSITORY lowercased; a registry that is
      not GitHub sets neither, so it is passed explicitly there.
    required: false
    default: ''
  token:
    description: >-
      Token for the registry. Defaults to $GITHUB_TOKEN, which is enough for a public
      package and is scoped to a pull token for a private one.
    required: false
    default: ''

  check-name:
    description: 'Name of the check run the progress is published to'
    required: false
    default: 'oci-pull'

outputs:
  path:
    description: 'The file that was written.'
    value: ${{ steps.pull.outputs.path }}
  name:
    description: 'Its basename.'
    value: ${{ steps.pull.outputs.name }}
  digest:
    description: 'The blob digest the manifest named.'
    value: ${{ steps.pull.outputs.digest }}

runs:
  using: 'composite'
  steps:
    - name: oci-pull
      shell: bash
      # THE ENVIRONMENT IS HOW A COMPOSITE ACTION PASSES INPUTS: neither the caller's env nor the
      # `github` context reaches this file. A hyphenated input name (`disk-gb`) becomes
      # `INPUT_DISK-GB`, which no shell can expand, so the script reads the names defined here.
      #
      # AN INPUT WITH A HYPHEN IS WHERE THE ALIAS MATTERS, and the note above says why.
      env:
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_DEST: ${{ inputs.dest }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_CHECK_NAME: ${{ inputs.check-name }}
      run: |
        set -euo pipefail
        # THE SCRIPT SITS IN THE ACTION'S OWN CHECKOUT, one level up from this directory.
        # `$GITHUB_ACTION_PATH` is where that is; a relative path would resolve against the CALLER's
        # working directory.
        script="$GITHUB_ACTION_PATH/../lib/oci_pull.sh"
        if [ ! -f "$script" ]; then
          echo "oci-pull: $script is missing from the action checkout" >&2
          exit 2
        fi
        # `exec` SO THIS SHELL IS THE SCRIPT RATHER THAN ITS PARENT: the runner signals the step's
        # process, and a non-interactive bash has no SIGTERM trap - it would die and orphan the work
        # onto PID 1, where no handler of its own can run.
        exec sh "$script"
