name: 'Stream build output to a check run'
description: >-
  Publish a command's output into a GitHub check run while it runs, so a reader with a token can
  follow the build live. The Actions log is not readable until the step finishes; a check run's
  output.text is.
author: easydev-org
branding:
  icon: activity
  color: blue

inputs:
  command:
    description: >-
      The command to run and stream. Passed to the shell as-is.
    required: true
  token:
    description: >-
      Token used to create and update the check run. The caller passes its workflow token.
      It cannot be implicit: a composite action does not inherit the caller's environment, and
      this file has no access to the github context at all — naming that context in an expression
      here is a template error the runner refuses to load, even inside a description.
    required: true
  name:
    description: >-
      Name of the check run. Defaults to the job name, so one step per job needs no configuration.
    required: false
    default: ''
  interval:
    description: >-
      Seconds between updates. Every line would be one API call per line — far too many; a build
      that prints a thousand lines a second would be a thousand requests a second.
    required: false
    default: '5'
  max_bytes:
    description: >-
      Character cap for the published text. GitHub refuses anything above 65535, so this is capped
      there; the newest lines are kept and the oldest are dropped with a note.
    required: false
    default: '65535'

runs:
  using: 'composite'
  steps:
    - name: stream output
      shell: bash
      env:
        # The token arrives as an input, because neither the caller's env nor the `github` context
        # reaches this file.
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_NAME: ${{ inputs.name }}
        INPUT_INTERVAL: ${{ inputs.interval }}
        INPUT_MAX_BYTES: ${{ inputs.max_bytes }}
      run: |
        set -euo pipefail
        # The script sits IN the action's own directory. dirname would step out of it, which is
        # how the first version pointed at a file that does not exist — and then reported it as an
        # exit code rather than a missing path, which took a log dig to find.
        script="$GITHUB_ACTION_PATH/../lib/log_stream.py"
        if [ ! -f "$script" ]; then
          echo "log-stream: $script is missing from the action checkout" >&2
          exit 2
        fi
        args=(--interval "$INPUT_INTERVAL" --max-bytes "$INPUT_MAX_BYTES")
        if [ -n "${INPUT_NAME}" ]; then args+=(--name "$INPUT_NAME"); fi

        # exec, SO THE STREAMER IS THE PROCESS THE RUNNER CANCELS.
        #
        # WITHOUT IT, A CANCEL NEVER REACHED log_stream.py AT ALL, and the step ran to its own
        # timeout instead of stopping. Measured on macos15 run 42000179043: cancelled twice,
        # at 10:31 and 10:39, and at 10:41 the `enable Remote Login` step was still on its
        # "waiting up to 900s for the desktop" line with the check run's output frozen. It
        # would have ended at 10:48:14 on its own timeout, nine minutes after the first
        # request.
        #
        # THE PROCESS TREE EXPLAINS IT. `shell: bash` makes the runner start
        #
        #     bash --noprofile --norc -e -o pipefail {0}     <- the step's process
        #       └─ python3 log_stream.py                     <- has _kill_tree installed
        #            └─ bash -c "<the command>"              <- start_new_session=True
        #
        # and the runner signals THE STEP'S PROCESS, which is that outer bash. A
        # non-interactive bash has no trap for SIGTERM and no job control forwarding: it dies,
        # python is orphaned onto PID 1, and every signal handler in log_stream.py - the whole
        # _kill_tree path, written for exactly this - is never called. python keeps reading a
        # child that keeps running qemu.
        #
        # exec REPLACES that bash with python, so python IS the step's process and the first
        # signal lands on the handler:
        #
        #     python3 log_stream.py                          <- the step's process
        #       └─ bash -c "<the command>"                   <- killed as a process group
        #
        # The `set -euo pipefail` and the missing-script check above all run before this line,
        # so nothing is skipped by the replacement.
        exec python3 "$script" "${args[@]}" -- bash -c "$INPUT_COMMAND"
