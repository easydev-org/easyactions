name: 'OCI pull'
description: >-
  Pull an OCI artifact from a container registry, resuming the blob across resets instead of
  starting a multi-gigabyte transfer over.
author: easydev-org
branding:
  icon: download-cloud
  color: blue

inputs:
  tag:
    description: 'The tag to pull.'
    required: true
  dest:
    description: 'Directory to write into.'
    required: false
    default: 'out'
  path:
    description: >-
      The file name to write. Defaults to the publisher's title annotation, then to
      <tag>.qcow2.
    required: false
    default: ''
  registry:
    description: 'Registry host.'
    required: false
    default: 'ghcr.io'
  repository:
    description: >-
      owner/name to pull from. Defaults to $GITHUB_REPOSITORY lowercased; a registry that is
      not GitHub sets neither, so it is passed explicitly there.
    required: false
    default: ''
  token:
    description: >-
      Token for the registry. Defaults to $GITHUB_TOKEN, which is enough for a public
      package and is scoped to a pull token for a private one.
    required: false
    default: ''

  check-name:
    description: 'Name of the check run the progress is published to'
    required: false
    default: 'oci-pull'

outputs:
  path:
    description: 'The file that was written.'
    value: ${{ steps.pull.outputs.path }}
  name:
    description: 'Its basename.'
    value: ${{ steps.pull.outputs.name }}
  digest:
    description: 'The blob digest the manifest named.'
    value: ${{ steps.pull.outputs.digest }}

runs:
  using: 'composite'
  steps:
    - name: pull
      id: pull
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_DEST: ${{ inputs.dest }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        GITHUB_TOKEN: ${{ inputs.token || github.token }}
      # STREAMED, BECAUSE A SILENT TRANSFER IS INDISTINGUISHABLE FROM A HANG.
      #
      # This action moves 28 GiB in the macOS stages and printed nothing until it
      # finished, so a running job had no output at all - the Actions log cannot be
      # read until the step ends, and there was nothing else to read. log_stream.py
      # publishes the same lines to a check run while they happen.
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/../lib/log_stream.py" \
          --name "${{ inputs.check-name }}" --interval 20 \
          -- python3 "$GITHUB_ACTION_PATH/oci_pull.py"

